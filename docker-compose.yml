services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gharpe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gharpe
      POSTGRES_USER: gharpe
      POSTGRES_PASSWORD: gharpe_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data: